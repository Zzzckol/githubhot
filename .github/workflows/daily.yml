name: 每日抓取

on:
  schedule:
    # 一定要错开整点。GitHub 的定时任务在 UTC 0-4 是高峰期，整点（尤其 00:00）
    # 最容易被延迟甚至直接丢弃 —— 2026-10-27 早上那次就是这么没跑的。
    # 排在非整点、分三个时间段，只要有一次跑成，后面的都会因为「今天已有存档」跳过。
    - cron: "13 0 * * *"   # UTC 00:13 = 北京 08:13
    - cron: "37 2 * * *"   # UTC 02:37 = 北京 10:37
    - cron: "41 5 * * *"   # UTC 05:41 = 北京 13:41
    # 2026-10-29 三班全部没触发（Actions 记录里当天零条），所以再加两班兜底。
    # 只要有一天里任意一次跑成，后面的都会因为「今天已有存档」跳过，不会重复抓。
    - cron: "23 7 * * *"   # UTC 07:23 = 北京 15:23
    - cron: "47 11 * * *"  # UTC 11:47 = 北京 19:47
  workflow_dispatch: {}   # Actions 页面手动点，手动触发不受「今天已跑过」限制

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 一天两次，先看今天有没有存档，有就跳过，避免重复抓
      - name: 今天是否已经跑过
        id: check
        run: |
          D=$(date -u -d '+8 hours' +%F)
          if [ -f "pipeline/boards/$D.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今天（$D）已经有榜单存档，跳过抓取"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "今天（$D）还没有存档，开始抓"
          fi

      - name: 跑增量算法测试
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.skip != 'true'
        run: node pipeline/test-delta.mjs

      - name: 抓取
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.skip != 'true'
        env:
          # Actions 自带的 token，搜索额度 30 次/分钟、核心 5000 次/小时
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node pipeline/fetch.mjs --out assets/data.auto.js --var GH_DATA_AUTO

      - name: 补中文文案（本地库优先，配了 LLM_API_KEY 才会调模型）
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.skip != 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "没配 LLM_API_KEY：只用 pipeline/zh.json 本地文案库，没命中的新项目保留英文原文。"
            node pipeline/enrich.mjs --local-only
          else
            node pipeline/enrich.mjs
          fi

      # 不刷版本号，浏览器会一直吃旧的 data.auto.js 缓存，看起来就像没更新
      - name: 刷新缓存版本号
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.skip != 'true'
        run: node pipeline/stamp.mjs

      - name: 生成历史归档（往回看每天）
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.skip != 'true'
        run: node pipeline/archive.mjs

      - name: 提交结果
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.skip != 'true'
        run: |
          # 2026-10-30 事故复盘，两次：
          # 一、这里原来是 git pull --rebase --autostash。data.auto.js、data.archive.js、
          #     history.json、meta.json 都是「每天整份重写」的生成物，两边各改一份文本必然
          #     冲突，autostash 会把带 <<<<<<< 的坏文件弹回工作区，rebase 退出码还可能被判成
          #     成功 —— 那天就是这么把坏文件推上线的。
          # 二、改完第一版又踩一次：脚本里没写 set -e，merge-keep.mjs 崩了以后 bash 照跑，
          #     归档拿旧底子重算照样推送成功，看上去「更新了」，其实 history 和文案都被回退。
          #     所以下面第一行必须钉住「任何一条命令失败就停」，且合并失败绝不推送。
          set -euo pipefail

          git config user.name "githubhot-bot"
          git config user.email "githubhot-bot@users.noreply.github.com"

          git fetch origin main
          BEHIND=$(git rev-list --count HEAD..origin/main)
          if [ "$BEHIND" != "0" ]; then
            echo "落后远端 $BEHIND 个提交，改走「对齐后重算」，不做文本合并"
            D=$(date -u -d '+8 hours' +%F)

            # 今天刚抓的原料先存一份。文件名把 / 换成 __，供 merge-keep.mjs 认领
            rm -rf /tmp/keep
            mkdir -p /tmp/keep
            cp assets/data.auto.js /tmp/keep/assets__data.auto.js
            if [ -f pipeline/zh.json ]; then cp pipeline/zh.json /tmp/keep/pipeline__zh.json; fi
            if [ -f pipeline/history.json ]; then cp pipeline/history.json /tmp/keep/pipeline__history.json; fi
            if [ -f pipeline/meta.json ]; then cp pipeline/meta.json /tmp/keep/pipeline__meta.json; fi
            if [ -f "pipeline/boards/$D.json" ]; then cp "pipeline/boards/$D.json" /tmp/keep/board.json; fi

            git reset --hard origin/main

            # 今天的 board 直接放回；history/meta/zh 按条目合并，绝不文本合并
            if [ -f /tmp/keep/board.json ]; then cp /tmp/keep/board.json "pipeline/boards/$D.json"; fi
            if ! node pipeline/merge-keep.mjs --keep /tmp/keep --today "$D"; then
              echo "::error::合并今天抓的原料失败，放弃本次推送（宁可晚一天也不能推回退版）"
              exit 1
            fi

            # 按远端的底子重算生成物，冲突就没有发生的余地
            node pipeline/archive.mjs
            node pipeline/stamp.mjs
          fi

          # boards/ 必须提交，不然下次跑没有「昨天的榜」可比，名次变化和连续在榜全废
          git add assets/data.auto.js assets/data.archive.js pipeline/history.json pipeline/boards pipeline/meta.json pipeline/zh.json index.html

          if git diff --staged --quiet; then
            echo "今天数据没变化，不提交"
            exit 0
          fi

          # 闸一：暂存区里有冲突标记就直接失败，别上线
          if git grep --cached -n -E "^(<<<<<<< |>>>>>>> |^=======$)" > /tmp/marks.txt 2>/dev/null; then
            echo "::error::暂存区有 git 冲突标记，放弃推送"
            head -20 /tmp/marks.txt
            exit 1
          fi

          # 闸二：几个生成出来的脚本必须能通过语法检查，语法错会让整页数据加载失败
          for f in assets/data.auto.js assets/data.archive.js assets/app.js; do
            if ! node --check "$f"; then
              echo "::error::$f 语法检查没通过，放弃推送"
              exit 1
            fi
          done

          # 闸三：今天的日期真在快照里。写错日期或数据没跟上来时，这条能拦住「假装更新」
          if ! grep -q "\"snapshot\": \"$D" assets/data.auto.js; then
            echo "::error::data.auto.js 的快照日期不是今天（$D），放弃推送"
            grep -o "\"snapshot\": \"[^\"]*\"" assets/data.auto.js || true
            exit 1
          fi

          git commit -m "data: $(date -u -d '+8 hours' +%F)"
          git push origin HEAD:main
